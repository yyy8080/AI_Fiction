name: Deploy reader to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'novels/rollback-life/**'
      - 'docs/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 生成章节数据
        working-directory: novels/rollback-life/reader
        run: node build.mjs

      - name: 同步到 docs（兼容 Deploy from a branch）
        run: |
          rm -rf docs && mkdir -p docs && cp -a novels/rollback-life/reader/. docs/
          touch docs/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
        continue-on-error: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: novels/rollback-life/reader

  deploy:
    needs: build
    if: success()
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true
